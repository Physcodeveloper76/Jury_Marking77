{% raw %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jury Scoring Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Jury Scoring Portal</h1>
        </header>
        <main class="main" id="app">
            <section id="login-section" class="card">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" required />
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" required />
                    </div>
                    <button type="submit" class="btn">Sign In</button>
                </form>
                <div id="login-message" class="message"></div>
            </section>
            <section id="dashboard-section" class="card hidden">
                <h2>Welcome, <span id="display-name"></span>!</h2>
                <p>You are logged in as <strong id="role"></strong>.</p>
                <button id="logout-btn" class="btn">Log Out</button>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>{% endraw %}
