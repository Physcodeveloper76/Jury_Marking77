<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jury Scoring Portal – Login</title>
    <meta name="description" content="WEB FORGE AI Jury Scoring Portal – Official project evaluation login" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    {% include 'style_inline.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-hero">
            <div class="hero-content">
                <h1 class="hero-title">WEB FORGE AI</h1>
                <p class="hero-tagline">Jury Scoring Portal</p>
                <div class="hero-decoration"></div>
            </div>
        </div>
        <div class="login-panel">
            <div class="login-panel-inner">
                <h2 class="login-heading">Sign In</h2>
                <p class="login-subtext">Enter your credentials to access the evaluation portal</p>
                <form id="login-form" class="login-form">
                    <div class="field">
                        <label for="email">Username or Email</label>
                        <input type="text" id="email" name="email" placeholder="e.g. judge1" required autocomplete="username" />
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password" />
                            <button type="button" id="toggle-pw" class="pw-toggle">Show</button>
                        </div>
                    </div>
                    <button type="submit" id="login-submit" class="btn primary full-width">Sign In</button>
                    <div id="login-message" class="message"></div>
                </form>
            </div>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('login-form');
        const loginMsg = document.getElementById('login-message');
        const toggleBtn = document.getElementById('toggle-pw');
        const passwordInput = document.getElementById('password');

        const showMessage = (msg, isError = false) => {
            if (!loginMsg) return;
            loginMsg.textContent = msg;
            loginMsg.className = 'message ' + (isError ? 'error' : 'success');
        };

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                toggleBtn.textContent = type === 'password' ? 'Show' : 'Hide';
            });
        }

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    showMessage('Please fill in all fields', true);
                    return;
                }

                const submitBtn = document.getElementById('login-submit');
                submitBtn.textContent = 'Signing in...';
                submitBtn.disabled = true;

                try {
                    const resp = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ email, password })
                    });
                    const data = await resp.json();

                    if (!resp.ok) throw (data.error || 'Login failed');

                    showMessage('Login successful! Redirecting...');

                    setTimeout(() => {
                        if (data.role === 'admin') {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/judge';
                        }
                    }, 500);
                } catch (err) {
                    showMessage(err, true);
                    submitBtn.textContent = 'Sign In';
                    submitBtn.disabled = false;
                }
            });
        }
    });
    </script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
